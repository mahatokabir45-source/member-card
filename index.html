<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Card</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #1b2230, #0b0e14);
        font-family: Arial, sans-serif;
        color: white;
    }

    .card {
        width: 350px;
        padding: 25px;
        border-radius: 15px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 0 25px rgba(88,101,242,0.25);
        text-align: center;
        animation: pop 0.6s ease;
    }

    @keyframes pop {
        from { transform: scale(0.8); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    .title {
        font-size: 22px;
        font-weight: bold;
        color: #5865F2;
        margin-bottom: 10px;
    }

    .subtitle {
        font-size: 14px;
        opacity: 0.8;
        margin-bottom: 15px;
    }

    .msg {
        font-size: 15px;
        line-height: 1.5;
        color: #ddd;
    }

    .btn {
        margin-top: 20px;
        padding: 10px 15px;
        border: none;
        border-radius: 8px;
        background: #5865F2;
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        background: #4752c4;
    }
</style>

</head>

<body>

<div class="card">
    <div class="title">Welcome to Noorvana Server 🎉</div>
    <div class="subtitle">Glad to have you here!</div>

    <div class="msg">
        Hello new member 👋<br><br>
        Welcome to <b>Noorvana</b> community.<br>
        Follow rules, respect everyone, and enjoy your stay 💙<br><br>
        Let’s grow together and build something amazing 🚀
    </div>

    <button class="btn" onclick="alert('Welcome to Noorvana!')">
        Get Started
    </button>
</div>

</body>
</html>
